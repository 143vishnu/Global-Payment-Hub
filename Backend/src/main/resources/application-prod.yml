# ============================================================================
# Production Environment Profile Configuration
# ============================================================================
# Used for production deployment
# Features: Oracle DB, optimized settings, security hardened, full monitoring
# ============================================================================

spring:
  # Oracle Database Configuration (Production)
  datasource:
    url: jdbc:oracle:thin:@//prod-oracle-scan.jpmc.com:1521/GPSPROD
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME:gps_prod_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: GPS-Prod-HikariPool
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  
  # H2 Console (DISABLED in production)
  h2:
    console:
      enabled: false
  
  # JPA Configuration (Production)
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
  
  # Kafka Configuration (Production Cluster)
  kafka:
    bootstrap-servers: >
      prod-kafka-01.jpmc.com:9093,
      prod-kafka-02.jpmc.com:9093,
      prod-kafka-03.jpmc.com:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
        linger.ms: 10
        batch.size: 32768
        buffer.memory: 67108864
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      properties:
        isolation.level: read_committed
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        max.poll.interval.ms: 300000
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: ${KAFKA_JAAS_CONFIG}
  
  # JMS Configuration (IBM MQ - Production)
  jms:
    pub-sub-domain: false
    listener:
      acknowledge-mode: auto
      auto-startup: true
      concurrency: 10
      max-concurrency: 50

# IBM MQ Configuration (Production)
ibm:
  mq:
    queue-manager: PROD_QM1
    channel: PROD.APP.SVRCONN
    host: prod-ibmmq-01.jpmc.com
    port: 1414
    user: ${IBM_MQ_USER}
    password: ${IBM_MQ_PASSWORD}
    queue:
      payment-request: PROD.QUEUE.PAYMENT.REQUEST
      payment-response: PROD.QUEUE.PAYMENT.RESPONSE
      payment-dlq: PROD.QUEUE.PAYMENT.DLQ
    ssl:
      cipher-suite: TLS_RSA_WITH_AES_128_CBC_SHA256

# Server Configuration (Production)
server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:/app/config/keystore.jks}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-alias: gps-server
    key-store-type: JKS
  shutdown: graceful
  http2:
    enabled: true
  compression:
    enabled: true

# Logging Configuration (Production - Minimal)
logging:
  level:
    root: WARN
    com.GPS.Global.Payment.Strategy: INFO
    org.springframework.web: WARN
    org.springframework.kafka: WARN
    org.springframework.jms: WARN
    org.hibernate.SQL: WARN
    org.springframework.integration: WARN
  file:
    name: /var/log/gps/gps-prod.log
    max-size: 100MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"

# Management & Actuator (Production - Secured)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m

# Security Configuration
spring.security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://auth.jpmc.com/oauth2/default
        jwk-set-uri: https://auth.jpmc.com/oauth2/default/v1/keys

# Application Config
application:
  environment: production
  debug-mode: false
  
# Resilience & Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        sliding-window-size: 100
        permitted-number-of-calls-in-half-open-state: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60000
        automatic-transition-from-open-to-half-open-enabled: true
  
  retry:
    instances:
      paymentService:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - com.GPS.Global.Payment.Strategy.exception.PaymentProcessingException
