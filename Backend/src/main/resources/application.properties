# Application Configuration
spring.application.name=Global-Payment-Strategy
server.port=8080
server.servlet.context-path=/gps

# Active Profile (dev, prod)
spring.profiles.active=dev

# Oracle Database Configuration (Production)
# Uncomment for Oracle DB usage
#spring.datasource.url=jdbc:oracle:thin:@localhost:1521:ORCL
#spring.datasource.username=gps_user
#spring.datasource.password=gps_password
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=gps-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Topics
kafka.topics.payment-ingress=payment-ingress
kafka.topics.payment-processing=payment-processing
kafka.topics.payment-completed=payment-completed
kafka.topics.payment-failed=payment-failed
kafka.topics.payment-initiated=payment.initiated
kafka.topics.payment-response=payment.response
kafka.topics.payment-status=payment.status
kafka.consumer.group-id=gps-consumer-group

# Kafka Producer Settings
kafka.producer.client-id=gps-producer
kafka.producer.enable-transactions=true
kafka.producer.retry.max-attempts=3

# IBM MQ Configuration
ibm.mq.queue-manager=QM1
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.host=localhost
ibm.mq.port=1414
ibm.mq.user=mquser
ibm.mq.password=mqpassword
ibm.mq.queue.payment-request=DEV.QUEUE.PAYMENT.REQUEST
ibm.mq.queue.payment-response=DEV.QUEUE.PAYMENT.RESPONSE
ibm.mq.queue.payment-dlq=DEV.QUEUE.PAYMENT.DLQ

# JMS Configuration
spring.jms.pub-sub-domain=false
spring.jms.listener.acknowledge-mode=auto
spring.jms.listener.auto-startup=true
spring.jms.listener.concurrency=3
spring.jms.listener.max-concurrency=10

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Logging Configuration
logging.level.root=INFO
logging.level.com.GPS.Global.Payment.Strategy=DEBUG
logging.level.org.springframework.integration=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring Integration Configuration
spring.integration.endpoint.no-auto-startup=false
spring.integration.channel.auto-create=true

# Security (OAuth2)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.jpmc.com/oauth2/default
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.jpmc.com/oauth2/default/v1/keys

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
