# ============================================================================
# Global Payment Strategy (GPS) - Main Application Configuration
# ============================================================================
# Spring Boot Application Configuration (Common/Default)
# Author: GPS Platform Team
# Version: 1.0.0
# Date: 2026-02-01
# ============================================================================

spring:
  application:
    name: Global-Payment-Strategy
  
  # Profile Configuration
  profiles:
    active: local
  
  # Main Application Config
  main:
    banner-mode: console
    allow-bean-definition-overriding: false
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  # JPA Common Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        generate_statistics: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    export:
      prometheus:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.GPS.Global.Payment.Strategy: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO

# Application-Specific Configuration
application:
  name: Global Payment Strategy
  version: 1.0.0
  description: JPMC Payment Processing Platform - Channel Adapter
  
# Kafka Topics Configuration
kafka:
  topics:
    payment-ingress: payment-ingress
    payment-processing: payment-processing
    payment-completed: payment-completed
    payment-failed: payment-failed
    payment-initiated: payment.initiated
    payment-response: payment.response
    payment-status: payment.status
  consumer:
    group-id: gps-consumer-group
  producer:
    client-id: gps-producer
    enable-transactions: true
    retry:
      max-attempts: 3
